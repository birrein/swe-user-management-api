services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swe_users
      POSTGRES_USER: swe_user
      POSTGRES_PASSWORD: swe_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swe_user -d swe_users"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://swe_user:swe_password@db:5432/swe_users
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
